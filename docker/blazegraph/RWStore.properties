[DEFAULT]
; BlazeGraph RWStore properties
# Namespace to use
com.bigdata.rdf.sail.namespace=kb

# Journal mode: disk-based
com.bigdata.journal.AbstractJournal.bufferMode=DiskRW

# Journal file location inside the container
com.bigdata.journal.AbstractJournal.file=/var/lib/blazegraph/data/blazegraph.jnl

# Enable OWL/RDFS inference
com.bigdata.rdf.store.AbstractTripleStore.axiomsClass=com.bigdata.rdf.axioms.OwlAxioms
com.bigdata.rdf.store.AbstractTripleStore.justify=true
com.bigdata.rdf.store.AbstractTripleStore.statementIdentifiers=false

# Text indexing for full-text search
com.bigdata.rdf.store.AbstractTripleStore.textIndex=true

# Enable quads mode (named graphs)
com.bigdata.rdf.store.AbstractTripleStore.quads=false

# Query timeout (ms)
com.bigdata.rdf.sail.QueryHints.timeout=30000
