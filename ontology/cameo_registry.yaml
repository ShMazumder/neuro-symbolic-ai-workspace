version: "1.1b3"
standard: "CAMEO 1.1b3 (Conflict and Mediation Event Observations)"
last_updated: "2026-11-17"

# ── Root Categories (13 to 20: Conflict & Coercive Action) ────────────────────
root_categories:
  "13":
    name: "Threaten"
    description: "Verbal or non-verbal threats, warnings, or ultimatums of adverse action."
    is_conflict_related: true
    is_physical_violence: false

  "14":
    name: "Protest"
    description: "Public demonstrations, rallies, strikes, sit-ins, and civil dissent."
    is_conflict_related: true
    is_physical_violence: false

  "15":
    name: "Exhibit military or force posture"
    description: "Military or police troop mobilization, alerts, maneuvers, or shows of force."
    is_conflict_related: true
    is_physical_violence: false

  "16":
    name: "Reduce relations"
    description: "Formal diplomatic, financial, or political disengagement, including reducing aid."
    is_conflict_related: true
    is_physical_violence: false

  "17":
    name: "Coerce"
    description: "Repressive or administrative enforcement, curfews, arrests, raids, and property seizure."
    is_conflict_related: true
    is_physical_violence: false

  "18":
    name: "Assault"
    description: "Direct physical violence against individuals, targeted killings, torture, abductions, bombings."
    is_conflict_related: true
    is_physical_violence: true

  "19":
    name: "Fight"
    description: "Conventional combat, light arms warfare, artillery battles, armed confrontations."
    is_conflict_related: true
    is_physical_violence: true

  "20":
    name: "Engage in unconventional mass violence"
    description: "Mass atrocities, mass expulsions, ethnic cleansing, or weapons of mass destruction."
    is_conflict_related: true
    is_physical_violence: true

